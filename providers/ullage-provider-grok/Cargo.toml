serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
ullage-auth.workspace = true
ullage-core.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
