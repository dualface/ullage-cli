[package]
name = "ullage-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Local daemon and CLI that inspects subscription usage for Claude, ChatGPT, Grok, and Cursor."
repository = "https://github.com/dualface/ullage-cli"
homepage = "https://github.com/dualface/ullage-cli"
readme = "../../README.md"

[lib]
name = "ullage_app"

[[bin]]
name = "ullage"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
ullage-auth.workspace = true
ullage-client = { path = "../ullage-client" }
ullage-core.workspace = true
ullage-daemon = { path = "../ullage-daemon" }
ullage-http = { path = "../ullage-http" }
ullage-protocol.workspace = true
ullage-provider-claude.workspace = true
ullage-provider-chatgpt.workspace = true
ullage-provider-grok.workspace = true
ullage-provider-cursor.workspace = true
ullage-provider-opencode.workspace = true
ullage-provider-devin.workspace = true
ullage-provider-codex2api.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile = "3"
