name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin Ubuntu 24.04 so Linux archives stay on glibc 2.39, Homebrew's
          # current Linux Tier 1 floor. ubuntu-latest would jump to 26.04 and
          # break brew installs on 24.04.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: ullage-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: ullage-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: ullage-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: ullage-x86_64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ullage-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install libdbus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --locked --release -p ullage-cli --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          archive="${{ matrix.archive }}"
          staging="${archive%.tar.gz}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/ullage" LICENSE README.md "$staging/"
          tar -czf "$archive" "$staging"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "ullage-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ullage.exe" $staging/
          Copy-Item LICENSE $staging/
          Copy-Item README.md $staging/
          # Zip stays on GitHub Releases for a portable copy. WinGet uses the
          # Inno installer so silent install can register the user-level task.
          Compress-Archive -Path $staging -DestinationPath "${{ matrix.archive }}"

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $version = "${{ github.ref_name }}" -replace '^v',''
          & $iscc `
            "/DAppVersion=$version" `
            "/DSourceExe=$pwd\target\${{ matrix.target }}\release\ullage.exe" `
            "/DLicenseFile=$pwd\LICENSE" `
            "/DReadmeFile=$pwd\README.md" `
            "/DOutputDir=$pwd" `
            "$pwd\packaging\windows\ullage.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ullage-x86_64-pc-windows-setup.exe
          path: ullage-x86_64-pc-windows-setup.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      # Rewrites Formula/ullage.rb in dualface/homebrew-tap from the checksums
      # just published. Needs HOMEBREW_TAP_TOKEN: a PAT with contents:write on
      # the tap repo (GITHUB_TOKEN cannot push to another repository). Without
      # the secret the release still succeeds; repair with:
      # scripts/sync-homebrew-tap.sh --checksums dist/checksums.txt <tag>
      - name: Sync Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          ./scripts/sync-homebrew-tap.sh --skip-wait --checksums dist/checksums.txt "${GITHUB_REF_NAME}"
      # Opens a PR against microsoft/winget-pkgs from Dualface.Ullage
      # manifests. Needs WINGET_TOKEN: a PAT that can fork that repository
      # and open PRs. Without the secret, repair with:
      # scripts/sync-winget.sh --checksums dist/checksums.txt <tag>
      - name: Submit WinGet package
        if: env.WINGET_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          ./scripts/sync-winget.sh --skip-wait --checksums dist/checksums.txt "${GITHUB_REF_NAME}"
