name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin Ubuntu 24.04 so Linux archives stay on glibc 2.39, Homebrew's
          # current Linux Tier 1 floor. ubuntu-latest would jump to 26.04 and
          # break brew installs on 24.04.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: ullage-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: ullage-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: ullage-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: ullage-x86_64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ullage-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install libdbus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --locked --release -p ullage-cli --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          archive="${{ matrix.archive }}"
          staging="${archive%.tar.gz}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/ullage" LICENSE README.md "$staging/"
          tar -czf "$archive" "$staging"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "ullage-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ullage.exe" $staging/
          Copy-Item LICENSE $staging/
          Copy-Item README.md $staging/
          Compress-Archive -Path $staging -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      # Rewrites Formula/ullage.rb in dualface/homebrew-tap from the checksums
      # just published. Needs TAP_TOKEN: a PAT with contents:write on the tap
      # repo. Without the secret the release still succeeds; repair with:
      # scripts/sync-homebrew-tap.sh --checksums dist/checksums.txt <tag>
      - name: Sync Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          ./scripts/sync-homebrew-tap.sh --skip-wait --checksums dist/checksums.txt "${GITHUB_REF_NAME}"
